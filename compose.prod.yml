name: fritz-monitoring-prod

services:
  fritz-exporter:
    image: ghcr.io/domehahn/fritz-box-monitoring/exporter:v1.0.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - FRITZ_HOST=${FRITZ_HOST:-192.168.178.1}
      - FRITZ_PORT=${FRITZ_PORT:-49000}
      - FRITZ_USERNAME=${FRITZ_USERNAME:-}
      - FRITZ_PASSWORD_FILE=/run/secrets/fritz_password
      - FRITZ_USE_TLS=${FRITZ_USE_TLS:-false}
      - FRITZ_TIMEOUT=${FRITZ_TIMEOUT:-5.0}
      - EXPORTER_HOST=0.0.0.0
      - EXPORTER_PORT=8000
      - EXPORTER_COLLECTION_INTERVAL=${EXPORTER_COLLECTION_INTERVAL:-30}
      - EXPORTER_READY_MAX_AGE=${EXPORTER_READY_MAX_AGE:-120}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    secrets:
      - fritz_password
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      fritz-exporter:
        condition: service_healthy

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  alloy:
    image: grafana/alloy:v1.3.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${SYSLOG_BIND_ADDRESS:-127.0.0.1}:1514:1514/udp"
    networks:
      - backend
      - ingress
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command: run --storage.path=/tmp/alloy /etc/alloy/config.alloy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    networks:
      - backend
      - ingress
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    secrets:
      - grafana_admin_password
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

  device-manager:
    profiles:
      - admin
    image: ghcr.io/domehahn/fritz-box-monitoring/device-manager:v1.0.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - backend
      - fritz_egress
      - ingress
    environment:
      - FRITZ_HOST=${FRITZ_HOST:-192.168.178.1}
      - FRITZ_PORT=${FRITZ_PORT:-49000}
      - FRITZ_USERNAME=${FRITZ_USERNAME:-}
      - FRITZ_PASSWORD_FILE=/run/secrets/fritz_password
      - DEVICE_MANAGER_ADMIN_PASSWORD_FILE=/run/secrets/device_manager_admin_password
      - DEVICE_MANAGER_SECRET_KEY_FILE=/run/secrets/device_manager_secret_key
    secrets:
      - fritz_password
      - device_manager_admin_password
      - device_manager_secret_key
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  backend:
    internal: true
  fritz_egress:
    driver: bridge
  ingress:
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

secrets:
  fritz_password:
    file: ${FRITZ_MONITOR_PASSWORD_FILE:-./secrets/fritz_password.txt}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets/grafana_admin_password.txt}
  device_manager_admin_password:
    file: ${DEVICE_MANAGER_ADMIN_PASSWORD_FILE:-./secrets/device_manager_admin_password.txt}
  device_manager_secret_key:
    file: ${DEVICE_MANAGER_SECRET_KEY_FILE:-./secrets/device_manager_secret_key.txt}
