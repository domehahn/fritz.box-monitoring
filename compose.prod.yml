name: fritz-monitoring-prod

# The stack is split by concern; see docs/features.md. Everything is still
# one project — run it exactly as before:
#   docker compose -f compose.prod.yml --env-file .env.production up -d
include:
  - path: compose/core.yml
    project_directory: .
  - path: compose/exporters.yml
    project_directory: .
  - path: compose/host.yml
    project_directory: .
  - path: compose/apps.yml
    project_directory: .
