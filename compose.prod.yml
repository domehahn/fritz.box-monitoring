name: fritz-monitoring-prod

services:
  fritz-exporter:
    image: ghcr.io/domehahn/fritz-box-monitoring/exporter:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - FRITZ_HOST=${FRITZ_HOST:-192.168.178.1}
      - FRITZ_PORT=${FRITZ_PORT:-49000}
      - FRITZ_USERNAME=${FRITZ_MONITOR_USERNAME:-}
      - FRITZ_PASSWORD_FILE=/run/secrets/fritz_monitor_password
      - FRITZ_USE_TLS=${FRITZ_USE_TLS:-false}
      - FRITZ_TIMEOUT=${FRITZ_TIMEOUT:-5.0}
      - EXPORTER_HOST=0.0.0.0
      - EXPORTER_PORT=8000
      - EXPORTER_COLLECTION_INTERVAL=${EXPORTER_COLLECTION_INTERVAL:-30}
      - EXPORTER_READY_MAX_AGE=${EXPORTER_READY_MAX_AGE:-120}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    secrets:
      - fritz_monitor_password
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - ./config/blackbox/targets:/etc/blackbox/targets:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      fritz-exporter:
        condition: service_healthy

  # P4 — long-term metrics store. Prometheus remote-writes here; Grafana has it
  # as a second Prometheus-type datasource. ~7x smaller on disk than Prometheus.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    command:
      - '--retentionPeriod=${VM_RETENTION:-24}'
      - '--storageDataPath=/victoria-metrics-data'
      - '--selfScrapeInterval=30s'
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8428/health | grep -q OK"]
      interval: 30s
      timeout: 5s
      retries: 3

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.25.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Raw sockets for ICMP echo; still no other privileges.
      - NET_RAW
    networks:
      - backend
      - fritz_egress
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          memory: 16M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./config/loki/rules:/etc/loki/rules:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  alloy:
    image: grafana/alloy:v1.3.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${SYSLOG_BIND_ADDRESS:-127.0.0.1}:1514:1514/udp"
    networks:
      - backend
      - ingress
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # HTTP on 0.0.0.0 so Prometheus can scrape Alloy's own delivery metrics
    # (loki.write sent/dropped) — otherwise it binds loopback-only.
    # storage.path is ephemeral (/tmp): on restart Alloy re-reads recent
    # container log backlog, which Loki tolerates (dup lines in that window).
    # A persistent volume needs CAP_DAC_OVERRIDE or a writable-owner mount that
    # conflicts with cap_drop:ALL here — left as a documented trade-off.
    command: >-
      run
      --server.http.listen-addr=0.0.0.0:12345
      --storage.path=/tmp/alloy
      /etc/alloy/config.alloy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    networks:
      - backend
      - ingress
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-}
    secrets:
      - grafana_admin_password
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

  # Opt-in LAN reference probe. Enable with:  --profile iperf  and set
  # IPERF_TARGET to a wired host running `iperf3 -s`. Short test, long interval
  # (>= 600s) so it cannot continuously consume bandwidth.
  iperf-probe:
    profiles:
      - iperf
    image: ghcr.io/domehahn/fritz-box-monitoring/iperf-probe:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.iperf
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - IPERF_TARGET=${IPERF_TARGET:-}
      - IPERF_PORT=${IPERF_PORT:-5201}
      - IPERF_INTERVAL_SECONDS=${IPERF_INTERVAL_SECONDS:-21600}
      - IPERF_DURATION_SECONDS=${IPERF_DURATION_SECONDS:-5}
      - IPERF_BITRATE=${IPERF_BITRATE:-}
      - IPERF_REVERSE=${IPERF_REVERSE:-false}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9119/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  device-manager:
    profiles:
      - admin
    image: ghcr.io/domehahn/fritz-box-monitoring/device-manager:v1.0.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - backend
      - fritz_egress
      - ingress
    environment:
      - FRITZ_HOST=${FRITZ_HOST:-192.168.178.1}
      - FRITZ_PORT=${FRITZ_PORT:-49000}
      - FRITZ_USERNAME=${FRITZ_ADMIN_USERNAME:-${FRITZ_USERNAME:-}}
      - FRITZ_PASSWORD_FILE=/run/secrets/fritz_admin_password
      - DEVICE_MANAGER_ADMIN_PASSWORD_FILE=/run/secrets/device_manager_admin_password
      - DEVICE_MANAGER_SECRET_KEY_FILE=/run/secrets/device_manager_secret_key
      - FLASK_ENV=production
      # Mark the session cookie Secure so it is only sent over HTTPS. Keep the
      # default (false) ONLY while reaching the Device Manager directly on the
      # plain-HTTP 127.0.0.1:5000 bind below; set to true once it sits behind a
      # TLS-terminating reverse proxy (a Secure cookie is dropped over plain HTTP,
      # which breaks the session login and CSRF token).
      - SESSION_COOKIE_SECURE=${DEVICE_MANAGER_SESSION_COOKIE_SECURE:-false}
    secrets:
      - fritz_admin_password
      - device_manager_admin_password
      - device_manager_secret_key
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- Smart-home exporters (opt-in) --------------------------------------
  # Start all four:  docker compose --profile smarthome up -d
  # Start just one:  docker compose --profile hue up -d   (bosch|blink|fritzdect)
  # Each serves /metrics on its own port; Prometheus scrapes them over `backend`.
  # They stay healthy with no credentials (serving *_configured=0) so it is safe
  # to enable the profile before pairing every hub.

  hue-exporter:
    profiles: [smarthome, hue]
    image: ghcr.io/domehahn/fritz-box-monitoring/home-iot:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.hue"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - HUE_BRIDGE_HOST=${HUE_BRIDGE_HOST:-}
      # literal key, or a path to a file holding it (e.g. /secrets/hue_app_key.txt)
      - HUE_APP_KEY=${HUE_APP_KEY:-}
      - HUE_VERIFY_TLS=${HUE_VERIFY_TLS:-false}
      - HUE_CA_FILE=${HUE_CA_FILE:-}
      - HUE_INTERVAL_SECONDS=${HUE_INTERVAL_SECONDS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./secrets:/secrets:ro
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9120/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  bosch-exporter:
    profiles: [smarthome, bosch]
    image: ghcr.io/domehahn/fritz-box-monitoring/home-iot:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.bosch"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - BOSCH_SHC_HOST=${BOSCH_SHC_HOST:-}
      - BOSCH_SHC_CERT_FILE=${BOSCH_SHC_CERT_FILE:-/secrets/bosch-shc-cert.pem}
      - BOSCH_SHC_KEY_FILE=${BOSCH_SHC_KEY_FILE:-/secrets/bosch-shc-key.pem}
      - BOSCH_INTERVAL_SECONDS=${BOSCH_INTERVAL_SECONDS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./secrets:/secrets:ro
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 192M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9121/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  blink-exporter:
    profiles: [smarthome, blink]
    image: ghcr.io/domehahn/fritz-box-monitoring/home-iot:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.blink"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - BLINK_USERNAME=${BLINK_USERNAME:-}
      - BLINK_PASSWORD=${BLINK_PASSWORD:-}
      - BLINK_2FA_KEY=${BLINK_2FA_KEY:-}
      - BLINK_CREDENTIALS_FILE=${BLINK_CREDENTIALS_FILE:-/data/blink.json}
      - BLINK_INTERVAL_SECONDS=${BLINK_INTERVAL_SECONDS:-600}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - home_iot_data:/data
      - ./secrets:/secrets:ro   # BLINK_PASSWORD may point at /secrets/blink_password.txt
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 192M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9122/healthz')\""]
      interval: 60s
      timeout: 5s
      retries: 3

  fritzdect-exporter:
    profiles: [smarthome, fritzdect]
    image: ghcr.io/domehahn/fritz-box-monitoring/home-iot:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.fritzdect"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - FRITZ_HOST=${FRITZ_HOST:-192.168.178.1}
      - FRITZ_PORT=${FRITZ_PORT:-49000}
      - FRITZ_USERNAME=${FRITZ_MONITOR_USERNAME:-}
      - FRITZ_PASSWORD_FILE=/run/secrets/fritz_monitor_password
      - FRITZ_USE_TLS=${FRITZ_USE_TLS:-false}
      - FRITZDECT_INTERVAL_SECONDS=${FRITZDECT_INTERVAL_SECONDS:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    secrets:
      - fritz_monitor_password
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9123/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Host & container monitoring (P1) --------------------------------
  # Always on. cAdvisor = per-container CPU/mem/net/restarts (works on any OS).
  # node-exporter = the host the engine runs on; on Docker Desktop / macOS that
  # is the Linux VM, not the Mac, but its disk/memory headroom is still what the
  # stack actually runs in.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile'
    networks:
      - backend
    volumes:
      - /:/host:ro,rslave
      - backup_textfile:/textfile:ro   # backup_last_success_timestamp_seconds etc.
    deploy:
      resources:
        limits: { cpus: '0.2', memory: 64M }

  # P1 — restic backup of every data volume + config/secrets/.env. Writes a
  # Prometheus textfile that node-exporter picks up. Local repo by default
  # (point BACKUP_DIR at a NAS mount); set RESTIC_REPOSITORY=b2:... for cloud.
  backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # read every file in the data volumes regardless of owner/mode
      - DAC_READ_SEARCH
    environment:
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-/repo}
      - RESTIC_PASSWORD_FILE=/run/secrets/restic_password
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - RESTIC_KEEP=${RESTIC_KEEP:---keep-daily 7 --keep-weekly 4 --keep-monthly 6}
      - B2_ACCOUNT_ID=${B2_ACCOUNT_ID:-}
      - B2_ACCOUNT_KEY=${B2_ACCOUNT_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/repo
      - backup_textfile:/textfile
      - grafana_data:/data/grafana_data:ro
      - prometheus_data:/data/prometheus_data:ro
      - victoriametrics_data:/data/victoriametrics_data:ro
      - loki_data:/data/loki_data:ro
      - alertmanager_data:/data/alertmanager_data:ro
      - home_iot_data:/data/home_iot_data:ro
      - ./config:/project/config:ro
      - ./secrets:/project/secrets:ro
      - ./compose.prod.yml:/project/compose.prod.yml:ro
      - ./.env.production:/project/.env.production:ro
    secrets:
      - restic_password
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  # Per-container CPU/memory/network/restarts straight off the Docker Engine
  # API socket. Replaces cAdvisor, which cannot read the overlay2 layer DB on
  # Docker Desktop / macOS and there returns only the root cgroup.
  dockerstats-exporter:
    image: ghcr.io/domehahn/fritz-box-monitoring/home-iot:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.dockerstats"]
    restart: unless-stopped
    # Root is needed to read the Docker socket (root:root on Docker Desktop);
    # every capability is still dropped and no-new-privileges is set, and the
    # socket is mounted read-only. Harden further with a docker-socket-proxy if
    # you want zero root — this exporter only issues GETs.
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOCKERSTATS_INTERVAL_SECONDS=${DOCKERSTATS_INTERVAL_SECONDS:-20}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 128M }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9126/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Per-device bandwidth via the FRITZ!Box packet capture (opt-in) ---
  # Streams a live pcap of the LAN bridge and counts bytes per local IP.
  # LOADS THE FRITZ!Box CPU — keep sessions short / set LANTAP_MAX_MINUTES.
  lantap-exporter:
    profiles: [lantap]
    image: ghcr.io/domehahn/fritz-box-monitoring/home-iot:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.lantap"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - FRITZ_HOST=${FRITZ_HOST:-192.168.178.1}
      - FRITZ_USERNAME=${FRITZ_ADMIN_USERNAME:-${FRITZ_MONITOR_USERNAME:-}}
      - FRITZ_PASSWORD_FILE=/run/secrets/fritz_admin_password
      - LANTAP_IFACE=${LANTAP_IFACE:-1-lan}
      - LANTAP_SNAPLEN=${LANTAP_SNAPLEN:-128}
      - LANTAP_SUBNETS=${LANTAP_SUBNETS:-192.168.178.0/24}
      - LANTAP_MAX_MINUTES=${LANTAP_MAX_MINUTES:-0}
      - LANTAP_RECONNECT_MINUTES=${LANTAP_RECONNECT_MINUTES:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    secrets:
      - fritz_admin_password
    deploy:
      resources:
        limits: { cpus: '0.75', memory: 160M }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9129/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Energy price + optional meter (P3) --------------------------
  # aWATTar spot price works with zero config (DE/AT). Add a Tibber token or a
  # Shelly EM IP for real consumption. Always on; degrades to energy_up=0.
  energy-exporter:
    image: ghcr.io/domehahn/fritz-box-monitoring/home-iot:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.energy"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - ENERGY_MARKET=${ENERGY_MARKET:-awattar_de}
      - ENERGY_VAT=${ENERGY_VAT:-1.19}
      - ENERGY_SURCHARGE_CT_KWH=${ENERGY_SURCHARGE_CT_KWH:-0}
      - TIBBER_TOKEN=${TIBBER_TOKEN:-}
      - SHELLY_HOST=${SHELLY_HOST:-}
      - ENERGY_INTERVAL_SECONDS=${ENERGY_INTERVAL_SECONDS:-120}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits: { cpus: '0.2', memory: 96M }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9128/healthz')\""]
      interval: 60s
      timeout: 5s
      retries: 3

  # --- Reverse proxy (P4, opt-in) ---------------------------------
  # HTTPS + one hostname for Grafana. `docker compose --profile proxy up -d`.
  caddy:
    profiles: [proxy]
    image: caddy:2.8-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:443:443"
      - "${PROXY_BIND_ADDRESS:-0.0.0.0}:80:80"
    networks:
      - backend
      - ingress
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - PROXY_DOMAIN=${PROXY_DOMAIN:-localhost}
      - PROXY_TLS=${PROXY_TLS:-internal}
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 96M }
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Weekly digest -> ntfy (P6) --------------------------------
  digest:
    image: ghcr.io/domehahn/fritz-box-monitoring/home-iot:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.digest"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - DIGEST_DAY=${DIGEST_DAY:-0}
      - DIGEST_HOUR=${DIGEST_HOUR:-9}
      - DIGEST_WINDOW=${DIGEST_WINDOW:-7d}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits: { cpus: '0.2', memory: 96M }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9130/healthz')\""]
      interval: 60s
      timeout: 5s
      retries: 3

  # --- Alerting (P0) ------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 96M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Alertmanager webhook -> ntfy push. Needs internet (ntfy.sh) unless NTFY_URL
  # points at a LAN server.
  alertbridge:
    image: ghcr.io/domehahn/fritz-box-monitoring/home-iot:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.alertbridge"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits: { cpus: '0.2', memory: 96M }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9127/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Weather (P3) ---------------------------------------------------
  # DWD data via Bright Sky (api.brightsky.dev) — no API key. Set WEATHER_LAT /
  # WEATHER_LON in .env.production to your location.
  weather-exporter:
    profiles: [smarthome, weather]
    image: ghcr.io/domehahn/fritz-box-monitoring/home-iot:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.weather"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - WEATHER_LAT=${WEATHER_LAT:-}
      - WEATHER_LON=${WEATHER_LON:-}
      - WEATHER_STATION=${WEATHER_STATION:-}
      - WEATHER_INTERVAL_SECONDS=${WEATHER_INTERVAL_SECONDS:-300}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits: { cpus: '0.2', memory: 96M }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9124/healthz')\""]
      interval: 60s
      timeout: 5s
      retries: 3

  # --- Speedtest (P4) ----------------------------------------------
  # Cloudflare speed test — no external binary. Bandwidth-heavy: interval
  # floored at 1800s. Opt-in (profile: speedtest).
  speedtest-exporter:
    profiles: [speedtest]
    image: ghcr.io/domehahn/fritz-box-monitoring/home-iot:v1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.speedtest"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - fritz_egress
    environment:
      - SPEEDTEST_INTERVAL_SECONDS=${SPEEDTEST_INTERVAL_SECONDS:-3600}
      - SPEEDTEST_MAX_MB=${SPEEDTEST_MAX_MB:-100}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9125/healthz')\""]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  backend:
    internal: true
  fritz_egress:
    driver: bridge
  ingress:
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  home_iot_data:   # Blink cloud token cache (home_iot.blink)
  alertmanager_data:
  victoriametrics_data:
  backup_textfile:
  caddy_data:
  caddy_config:

secrets:
  fritz_monitor_password:
    file: ${FRITZ_MONITOR_PASSWORD_FILE:-./secrets/fritz_password.txt}
  fritz_admin_password:
    file: ${FRITZ_ADMIN_PASSWORD_FILE:-./secrets/fritz_password.txt}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./secrets/grafana_admin_password.txt}
  device_manager_admin_password:
    file: ${DEVICE_MANAGER_ADMIN_PASSWORD_FILE:-./secrets/device_manager_admin_password.txt}
  device_manager_secret_key:
    file: ${DEVICE_MANAGER_SECRET_KEY_FILE:-./secrets/device_manager_secret_key.txt}
  restic_password:
    file: ${RESTIC_PASSWORD_FILE:-./secrets/restic_password.txt}
