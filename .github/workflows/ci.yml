name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --with dev

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check with mypy
        run: |
          mypy src/

      - name: Run unit tests with coverage
        run: |
          PYTHONPATH=src pytest --cov=fritz_monitoring tests/

      - name: Validate Docker Compose Production Config
        run: |
          mkdir -p secrets
          echo "test_password" > secrets/fritz_password.txt
          echo "test_password" > secrets/grafana_admin_password.txt
          echo "test_password" > secrets/device_manager_admin_password.txt
          echo "test_secret_key" > secrets/device_manager_secret_key.txt
          docker compose -f compose.prod.yml config
