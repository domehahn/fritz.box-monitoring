name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --with dev

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check with mypy
        run: |
          mypy src/

      - name: Run unit tests with coverage
        run: |
          PYTHONPATH=src pytest --cov=fritz_monitoring tests/

      - name: Audit Python dependencies for known vulnerabilities
        run: |
          # PYSEC-2026-1845: pytest /tmp/pytest-of-* local DoS, dev/CI-only, fix needs pytest 9.
          pip-audit --skip-editable --progress-spinner=off --desc \
            --ignore-vuln PYSEC-2026-1845

      - name: Validate Docker Compose Production Config
        run: |
          mkdir -p secrets
          echo "test_password" > secrets/fritz_password.txt
          echo "test_password" > secrets/grafana_admin_password.txt
          echo "test_password" > secrets/device_manager_admin_password.txt
          echo "test_secret_key" > secrets/device_manager_secret_key.txt
          docker compose -f compose.prod.yml config
          docker compose -f compose.prod.yml --profile admin --profile iperf --profile smarthome --profile weather --profile speedtest --profile lantap --profile proxy config

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Weak-secret check
        run: |
          mkdir -p secrets
          for s in fritz_password grafana_admin_password device_manager_admin_password device_manager_secret_key restic_password; do
            [ -f "secrets/$s.txt" ] || head -c 32 /dev/urandom | base64 > "secrets/$s.txt"
          done
          bash scripts/check-secrets.sh   # non-fatal in CI (placeholder secrets)

      - name: Validate Prometheus config & rules
        run: |
          docker run --rm -v "$PWD/config:/config:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 \
            check config /config/prometheus.yml
          docker run --rm -v "$PWD/config:/config:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 \
            check rules /config/prometheus/rules/fritz_alerts.yml \
                        /config/prometheus/rules/fritz_recording_rules.yml \
                        /config/prometheus/rules/probe_rules.yml \
                        /config/prometheus/rules/smarthome_alerts.yml \
                        /config/prometheus/rules/climate_rules.yml \
                        /config/prometheus/rules/climate_alerts.yml \
                        /config/prometheus/rules/host_alerts.yml \
                        /config/prometheus/rules/http_probe_rules.yml \
                        /config/prometheus/rules/energy_rules.yml \
                        /config/prometheus/rules/occupancy_rules.yml \
                        /config/prometheus/rules/lantap_alerts.yml \
                        /config/prometheus/rules/backup_alerts.yml \
                        /config/prometheus/rules/health_rules.yml \
                        /config/prometheus/rules/anomaly_rules.yml \
                        /config/prometheus/rules/security_alerts.yml \
                        /config/prometheus/rules/watchdog.yml \
                        /config/prometheus/rules/meta_rules.yml \
                        /config/prometheus/rules/automation_alerts.yml \
                        /config/prometheus/rules/slo_rules.yml \
                        /config/prometheus/rules/bufferbloat_alerts.yml

      - name: Validate Caddyfile
        run: |
          docker run --rm -v "$PWD/config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e PROXY_DOMAIN=localhost -e PROXY_TLS=internal \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate Alertmanager config
        run: |
          docker run --rm -v "$PWD/config/alertmanager:/c:ro" \
            --entrypoint amtool prom/alertmanager:v0.27.0 check-config /c/alertmanager.yml

      - name: Validate Alloy config
        run: |
          docker run --rm -v "$PWD/config/alloy/config.alloy:/c.alloy:ro" \
            grafana/alloy:v1.3.1 fmt /c.alloy > /dev/null

      - name: Validate Blackbox config
        run: |
          docker run --rm -v "$PWD/config/blackbox/blackbox.yml:/c.yml:ro" \
            --entrypoint sh quay.io/prometheus/blackbox-exporter:v0.25.0 \
            -c 'blackbox_exporter --config.file=/c.yml --config.check'

      - name: Validate Grafana dashboard JSON
        run: python3 scripts/lint-dashboards.py
