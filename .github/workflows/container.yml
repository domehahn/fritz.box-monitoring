name: Container Build & Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout fritz-avm-client dependency
        uses: actions/checkout@v4
        with:
          repository: domehahn/fritz-avm-client
          path: fritz-avm-client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Exporter Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.exporter
          load: true
          tags: fritz-exporter:test

      - name: Build Device Manager Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.device_manager
          load: true
          tags: device-manager:test

      - name: Run Trivy Vulnerability Scanner on Exporter
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fritz-exporter:test'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Run Trivy Vulnerability Scanner on Device Manager
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'device-manager:test'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
