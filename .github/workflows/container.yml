name: Container Build & Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b4ef4073d4351881d792a65d # v3.7.1

      - name: Build Exporter Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.exporter
          load: true
          tags: fritz-exporter:test

      - name: Build Device Manager Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.device_manager
          load: true
          tags: device-manager:test

      - name: Build iperf Probe Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.iperf
          load: true
          tags: iperf-probe:test

      - name: Build Smart-Home Exporters Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.home_iot
          load: true
          tags: home-iot:test

      - name: Run Trivy Vulnerability Scanner on Exporter
        uses: aquasecurity/trivy-action@18f2510ee396bbf400dbea417387ca6b8f641c25 # 0.29.0
        with:
          image-ref: 'fritz-exporter:test'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Run Trivy Vulnerability Scanner on Device Manager
        uses: aquasecurity/trivy-action@18f2510ee396bbf400dbea417387ca6b8f641c25 # 0.29.0
        with:
          image-ref: 'device-manager:test'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Run Trivy Vulnerability Scanner on iperf Probe
        uses: aquasecurity/trivy-action@18f2510ee396bbf400dbea417387ca6b8f641c25 # 0.29.0
        with:
          image-ref: 'iperf-probe:test'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Run Trivy Vulnerability Scanner on Smart-Home Exporters
        uses: aquasecurity/trivy-action@18f2510ee396bbf400dbea417387ca6b8f641c25 # 0.29.0
        with:
          image-ref: 'home-iot:test'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
