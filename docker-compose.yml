version: '3.8'

services:
  # Prometheus - Time series database and metrics storage
  prometheus:
    image: prom/prometheus:latest
    container_name: fritz_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - fritz_network
    restart: unless-stopped
    labels:
      - "com.example.description=Prometheus monitoring"

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: fritz_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - fritz_network
    depends_on:
      - prometheus
    restart: unless-stopped
    labels:
      - "com.example.description=Grafana visualization"

  # InfluxDB - Optional time series database
  influxdb:
    image: influxdb:2.7
    container_name: fritz_influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=fritz_monitoring
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=influxdb_password
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - fritz_network
    restart: unless-stopped
    labels:
      - "com.example.description=InfluxDB time series database"

  # Node Exporter - System metrics
  node_exporter:
    image: prom/node-exporter:latest
    container_name: fritz_node_exporter
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - fritz_network
    restart: unless-stopped
    labels:
      - "com.example.description=Node Exporter for system metrics"

  # Alertmanager - Alert management
  alertmanager:
    image: prom/alertmanager:latest
    container_name: fritz_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - fritz_network
    restart: unless-stopped
    labels:
      - "com.example.description=Prometheus Alertmanager"

  # Fritz!Box Exporter - Custom Python exporter
  fritz_exporter:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: fritz_exporter
    ports:
      - "8000:8000"
    environment:
      - FRITZ_HOST=${FRITZ_HOST:-192.168.178.1}
      - FRITZ_PORT=${FRITZ_PORT:-49000}
      - FRITZ_USERNAME=${FRITZ_USERNAME:-dslf}
      - FRITZ_PASSWORD=${FRITZ_PASSWORD}
      - EXPORTER_PORT=8000
      - EXPORTER_HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - COLLECTION_INTERVAL=60
    volumes:
      - ./logs:/app/logs
    networks:
      - fritz_network
    depends_on:
      - prometheus
    restart: unless-stopped
    labels:
      - "com.example.description=Fritz!Box Prometheus Exporter"

networks:
  fritz_network:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  influxdb_data:
    driver: local
  alertmanager_data:
    driver: local
