services:
  # Main Fritz!Box Exporter - Collects mesh topology and all device metrics
  fritz_exporter:
    build:
      context: .
      dockerfile: docker/Dockerfile.exporter
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    networks:
      - fritz_monitoring

  # Mesh Discovery Service - Automatically discovers all mesh nodes and generates Prometheus targets
  mesh_discovery:
    build:
      context: .
      dockerfile: docker/Dockerfile.discovery
    env_file:
      - .env
    environment:
      - DISCOVERY_INTERVAL=300  # Scan every 5 minutes
    volumes:
      - ./src:/app/src
      - prometheus_targets:/prometheus/targets
    restart: unless-stopped
    networks:
      - fritz_monitoring
    depends_on:
      - fritz_exporter

  # Device Manager - Web UI for managing and deleting devices
  device_manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.device_manager
    env_file:
      - .env
    ports:
      - "5001:5000"
    networks:
      - fritz_monitoring
    restart: unless-stopped
    depends_on:
      - fritz_exporter

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_targets:/prometheus/targets
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - fritz_monitoring
    depends_on:
      - fritz_exporter
      - mesh_discovery
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - fritz_monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml
    ports:
      - "9080:9080"
      - "1514:1514/udp"
    networks:
      - fritz_monitoring
    depends_on:
      - loki
    restart: unless-stopped

  log_pusher:
    build:
      context: .
      dockerfile: docker/Dockerfile.log_pusher
    volumes:
      - ./src:/app/src
    networks:
      - fritz_monitoring
    depends_on:
      - fritz_exporter
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - fritz_monitoring
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

networks:
  fritz_monitoring:
    driver: bridge

volumes:
  prometheus_data:
  prometheus_targets:
  loki_data:
  grafana_data:
