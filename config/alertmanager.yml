global:
  resolve_timeout: 5m
  slack_api_url: '' # Set your Slack webhook URL here if needed

route:
  receiver: 'default'
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

receivers:
  - name: 'default'
    # Add notification integrations here
    # Example Slack:
    # slack_configs:
    #   - channel: '#alerts'
    #     title: 'Alert: {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
