global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Main Fritz!Box exporter - collects mesh topology and device metrics
  - job_name: 'fritz_main'
    scrape_interval: 2m
    scrape_timeout: 90s
    static_configs:
      - targets: ['fritz_exporter:8000']
        labels:
          instance_type: 'main_exporter'

  # Dynamic mesh node discovery
  # Automatically discovers all repeaters and powerline adapters
  - job_name: 'fritz_mesh_dynamic'
    scrape_interval: 2m
    scrape_timeout: 90s
    file_sd_configs:
      - files:
          - '/prometheus/targets/mesh-targets.json'
        refresh_interval: 1m
    # Relabel to use the target parameter
    relabel_configs:
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [device_name]
        target_label: device
      - source_labels: [node_type]
        target_label: type
