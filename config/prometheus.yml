global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# P4 — long-term storage. Prometheus keeps a short local window
# (PROMETHEUS_RETENTION_TIME); everything is mirrored to VictoriaMetrics, which
# compresses hard and holds years. Grafana has both datasources.
remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    queue_config:
      max_samples_per_send: 10000
      capacity: 20000

scrape_configs:
  - job_name: 'fritz'
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets: ['fritz-exporter:8000']
        labels:
          instance_type: 'fritz_exporter'

  # ------------------------------------------------------------------
  # Active path probing via Blackbox Exporter.
  # Targets live in config/blackbox/targets/*.yml (file_sd, hot-reloaded).
  # Each job rewrites __address__ to the blackbox exporter and passes the
  # real probe target as ?target=; `instance` becomes the probe target.
  # ------------------------------------------------------------------
  - job_name: 'blackbox_exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']

  # Alloy's own health — lets us see loki.write delivery / drops.
  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']

  # Opt-in iperf3 LAN reference probe (compose profile: iperf). Target is DOWN
  # when the profile is not enabled — that is expected.
  - job_name: 'iperf_probe'
    static_configs:
      - targets: ['iperf-probe:9119']

  # ------------------------------------------------------------------
  # Smart-home exporters (compose profile: smarthome, or hue|bosch|blink|
  # fritzdect). Targets are DOWN while the profile is disabled — expected.
  # Each exporter also serves <name>_configured / <name>_up so you can tell
  # "not enabled" from "enabled but the hub is unreachable".
  # ------------------------------------------------------------------
  - job_name: 'hue_exporter'
    scrape_interval: 60s
    static_configs:
      - targets: ['hue-exporter:9120']

  - job_name: 'bosch_exporter'
    scrape_interval: 60s
    static_configs:
      - targets: ['bosch-exporter:9121']

  - job_name: 'blink_exporter'
    scrape_interval: 60s
    static_configs:
      - targets: ['blink-exporter:9122']

  - job_name: 'fritzdect_exporter'
    scrape_interval: 60s
    static_configs:
      - targets: ['fritzdect-exporter:9123']

  - job_name: 'probe_icmp_infra'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [icmp_lan]
    file_sd_configs:
      - files: ['/etc/blackbox/targets/icmp_infra.yml']
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'probe_icmp_internet'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: ['/etc/blackbox/targets/icmp_internet.yml']
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'probe_dns_local'
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [dns_a]
    file_sd_configs:
      - files: ['/etc/blackbox/targets/dns_local.yml']
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'probe_dns_external'
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [dns_a]
    file_sd_configs:
      - files: ['/etc/blackbox/targets/dns_external.yml']
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # HTTP(S) reachability + TLS-cert expiry for services that matter (P4).
  # Edit config/blackbox/targets/http_services.yml (file_sd, hot-reloaded).
  - job_name: 'probe_http'
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ['/etc/blackbox/targets/http_services.yml']
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- Host & container monitoring (P1) ---
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'dockerstats'
    scrape_interval: 20s
    static_configs:
      - targets: ['dockerstats-exporter:9126']

  # --- Alerting plumbing (P0) ---
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # --- Long-term storage (P4) ---
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['victoriametrics:8428']
    metrics_path: /metrics

  - job_name: 'energy_exporter'
    scrape_interval: 60s
    static_configs:
      - targets: ['energy-exporter:9128']

  # --- Weather (P3) / Speedtest (P4). DOWN unless their profile is enabled. ---
  - job_name: 'weather_exporter'
    scrape_interval: 300s
    static_configs:
      - targets: ['weather-exporter:9124']

  - job_name: 'speedtest_exporter'
    scrape_interval: 300s
    static_configs:
      - targets: ['speedtest-exporter:9125']
