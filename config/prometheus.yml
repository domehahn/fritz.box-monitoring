global:
  scrape_interval: 60s
  evaluation_interval: 60s
  external_labels:
    monitor: 'fritz-box-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Fritz!Box Exporter
  - job_name: 'fritz-exporter'
    static_configs:
      - targets: ['fritz_exporter:8000']
    scrape_interval: 60s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node_exporter:9100']
