groups:
  - name: backup_alerts
    rules:
      - alert: BackupStale
        expr: time() - backup_last_success_timestamp_seconds > 129600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No successful backup in {{ $value | humanizeDuration }}"
          description: "restic has not completed a backup for over 36h — the stack is unprotected. Check the `backup` container."

      - alert: BackupFailing
        expr: backup_last_run_success == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The last backup run failed"
          description: "restic backup exited non-zero. Check `docker logs fritz-monitoring-prod-backup-1`."

      - alert: BackupMetricsMissing
        expr: absent(backup_last_run_timestamp_seconds)
        for: 6h
        labels:
          severity: info
        annotations:
          summary: "No backup metrics — the backup service may not be running"

      - alert: BackupVerifyFailed
        expr: backup_last_verify_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Backup verification failed (restic check / restore smoke test)"
          description: "The repository failed `restic check --read-data-subset=5%` or the restore smoke test could not recover a known file. The backups may be corrupt or unreadable."

      - alert: BackupVerifyStale
        expr: time() - backup_last_verify_timestamp_seconds > 1209600
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "No backup verification in {{ $value | humanizeDuration }}"
          description: "restic check + a restore smoke test have not run for over 14 days. Confirm the `backup` loop is alive and BACKUP_VERIFY_EVERY is sane."
