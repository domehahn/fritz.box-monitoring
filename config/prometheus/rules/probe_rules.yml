# Recording + alerting rules for Blackbox Exporter path probes.
#
# Labels available on probe series (from file_sd): job, instance (probe target),
# probe_kind (infra|internet|dns_local|dns_external), hop / resolver.
#
# Blackbox sends one echo per scrape, so "packet loss" is the fraction of failed
# scrapes over a window, not per-packet loss. At 15s scrape / 5m window that is
# 20 samples -> 5% resolution.
groups:
  - name: probe_recording
    interval: 30s
    rules:
      - record: fritz:probe_rtt_seconds
        expr: probe_icmp_duration_seconds{phase="rtt"}

      - record: fritz:probe_rtt_seconds:p95_10m
        expr: >-
          quantile_over_time(0.95, probe_icmp_duration_seconds{phase="rtt"}[10m])

      - record: fritz:probe_loss_ratio:5m
        expr: 1 - avg_over_time(probe_success[5m])

      # Jitter = variation of ICMP RTT over a short window (stddev).
      - record: fritz:probe_jitter_seconds:10m
        expr: stddev_over_time(probe_icmp_duration_seconds{phase="rtt"}[10m])

      - record: fritz:dns_lookup_seconds
        expr: probe_dns_lookup_time_seconds{job=~"probe_dns_.+"}

      - record: fritz:dns_lookup_seconds:p95_10m
        expr: >-
          quantile_over_time(0.95,
            probe_dns_lookup_time_seconds{job=~"probe_dns_.+"}[10m])

      - record: fritz:dns_success_ratio:5m
        expr: >-
          avg_over_time(probe_success{job=~"probe_dns_.+"}[5m])

  - name: probe_alerts
    rules:
      - alert: FritzProbeTargetDown
        expr: probe_success{job=~"probe_.+"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Probe target {{ $labels.instance }} unreachable"
          description: "{{ $labels.job }} probe to {{ $labels.instance }} ({{ $labels.hop }}{{ $labels.resolver }}) has failed for 2m."

      - alert: FritzHighJitter
        expr: fritz:probe_jitter_seconds:10m > 0.010
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High jitter to {{ $labels.hop }}{{ $labels.resolver }} ({{ $value | humanizeDuration }})"
          description: "RTT stddev over 10m to {{ $labels.instance }} exceeds 10ms — unstable path (buffering, contention, Wi-Fi)."

      - alert: FritzHighGatewayLatency
        expr: fritz:probe_rtt_seconds:p95_10m{probe_kind="infra"} > 0.010
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High LAN latency to {{ $labels.hop }} ({{ $value | humanizeDuration }})"
          description: "p95 RTT over 10m to {{ $labels.instance }} exceeds 10ms."

      - alert: FritzCriticalGatewayLatency
        expr: fritz:probe_rtt_seconds:p95_10m{probe_kind="infra"} > 0.025
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical LAN latency to {{ $labels.hop }} ({{ $value | humanizeDuration }})"
          description: "p95 RTT over 10m to {{ $labels.instance }} exceeds 25ms."

      - alert: FritzHighWanLatency
        expr: >-
          min by () (fritz:probe_rtt_seconds:p95_10m{probe_kind="internet"}) > 0.050
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High WAN latency ({{ $value | humanizeDuration }} p95 to nearest anchor)"
          description: "p95 RTT to every internet anchor exceeds 50ms for 5m."

      - alert: FritzCriticalWanLatency
        expr: >-
          min by () (fritz:probe_rtt_seconds:p95_10m{probe_kind="internet"}) > 0.100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical WAN latency ({{ $value | humanizeDuration }} p95 to nearest anchor)"
          description: "p95 RTT to every internet anchor exceeds 100ms for 5m — likely ISP congestion or line issue."

      - alert: FritzHighPacketLoss
        expr: fritz:probe_loss_ratio:5m{job=~"probe_icmp_.+"} > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Packet loss to {{ $labels.instance }} ({{ $value | humanizePercentage }})"
          description: "{{ $labels.hop }} lost more than 1% of probes over the last 5m."

      - alert: FritzCriticalPacketLoss
        expr: fritz:probe_loss_ratio:5m{job=~"probe_icmp_.+"} > 0.03
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Severe packet loss to {{ $labels.instance }} ({{ $value | humanizePercentage }})"
          description: "{{ $labels.hop }} lost more than 3% of probes over the last 5m."

      - alert: FritzDnsSlow
        expr: fritz:dns_lookup_seconds:p95_10m > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Slow DNS via {{ $labels.resolver }} ({{ $value | humanizeDuration }} p95)"
          description: "p95 DNS lookup time over 10m via {{ $labels.instance }} exceeds 200ms."

      - alert: FritzDnsFailing
        expr: fritz:dns_success_ratio:5m < 0.8
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DNS resolution failing via {{ $labels.resolver }}"
          description: "Less than 80% of DNS probes via {{ $labels.instance }} succeeded over 5m."
