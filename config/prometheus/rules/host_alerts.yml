groups:
  - name: host_alerts
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "node-exporter is down"
          description: "The host/VM running the stack has not been scrapeable for 3m."

      - alert: HostHighCPU
        expr: >
          100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU > 90% for 15m"
          description: "Sustained CPU pressure on the stack host ({{ $value | printf \"%.0f\" }} %)."

      - alert: HostLowMemory
        expr: >
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host has < 10% memory available"
          description: "Only {{ $value | printf \"%.1f\" }} of memory free on the stack host."

      - alert: HostDiskAlmostFull
        expr: >
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} < 10% free"
          description: "{{ $value | printf \"%.1f\" }} free on {{ $labels.mountpoint }} — Prometheus/Loki will start dropping data."

      - alert: HostDiskWillFill
        expr: >
          predict_linear(
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 3 * 24 * 3600
          ) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} will fill within 3 days"
          description: "Linear projection of the last 6h of usage."

  - name: container_alerts
    rules:
      - alert: DockerStatsDown
        expr: dockerstats_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "dockerstats-exporter cannot reach the Docker socket"

      - alert: ContainerUnhealthy
        expr: docker_container_health == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is unhealthy"
          description: "Its Docker healthcheck has been failing for 5m."

      - alert: ContainerDown
        expr: docker_container_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is not running"

      - alert: ContainerFrequentRestarts
        expr: increase(docker_container_restart_count[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarting repeatedly"
          description: "{{ $value | printf \"%.0f\" }} restarts in the last hour."

      - alert: ContainerHighMemory
        expr: >
          docker_container_memory_bytes
          / (docker_container_memory_limit_bytes > 0) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} near its memory limit"
          description: "{{ $labels.name }} at {{ $value | printf \"%.0f%%\" }} of its limit for 15m."
