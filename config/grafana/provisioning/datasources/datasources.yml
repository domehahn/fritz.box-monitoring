apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100

  # P4 — long-term store. Prometheus-compatible query API; point any panel here
  # for history beyond the local Prometheus retention window.
  - name: VictoriaMetrics
    type: prometheus
    uid: victoriametrics
    access: proxy
    url: http://victoriametrics:8428
    jsonData:
      prometheusType: Prometheus
      timeInterval: 15s
