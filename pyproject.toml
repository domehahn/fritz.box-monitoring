[tool.poetry]
name = "fritz-monitoring"
version = "1.0.0"
description = "Fritz!Box monitoring stack with Prometheus, Grafana, Loki, and Alloy"
authors = ["Dominik Hahn"]
packages = [{include = "fritz_monitoring", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pydantic = ">=2.0.0"
# >=2.14.2: GHSA-4xgf-cpjx-pc3j (NestedSecretsSettingsSource symlink escape)
pydantic-settings = ">=2.14.2"
prometheus-client = ">=0.17.1"
fritz-avm-client = { git = "https://github.com/domehahn/fritz-avm-client.git", tag = "v0.4.0" }
loguru = ">=0.7.2"
# >=3.1.3: PYSEC-2026-2151 (missing Vary: Cookie on session access)
flask = ">=3.1.3"
gunicorn = ">=23.0.0"
# >=3.14.3: PYSEC-2026-3545/3546/3547 and earlier request-smuggling / DoS fixes
aiohttp = ">=3.14.3"
# >=2.33.0: PYSEC-2026-2275 (extract_zipped_paths temp-file reuse)
requests = ">=2.33.0"
pyyaml = ">=6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^1.0.0"
ruff = "^0.1.0"
mypy = "^1.5.0"
pip-audit = "^2.7.3"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
