[tool.poetry]
name = "fritz-monitoring"
version = "1.0.0"
description = "Fritz!Box monitoring stack with Prometheus, Grafana, Loki, and Alloy"
authors = ["Dominik Hahn"]
packages = [{include = "fritz_monitoring", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10"
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.3"
prometheus-client = ">=0.17.1"
fritz-avm-client = { path = "../fritz-avm-client", develop = true }
loguru = ">=0.7.2"
flask = ">=3.0.0"
gunicorn = ">=21.2.0"
aiohttp = ">=3.9.0"
requests = ">=2.31.0"
pyyaml = ">=6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
ruff = "^0.1.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
