[tool.poetry]
name = "fritz-box-monitoring"
version = "0.1.0"
description = "Comprehensive monitoring system for Fritz!Box and connected devices"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "fritz_monitoring", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fritzconnection = "^1.14"
prometheus-client = "^0.19"
pydantic = "^2.5"
pydantic-settings = "^2.1"
python-dotenv = "^1.0"
aiohttp = "^3.9"
asyncio = "^3.4.3"
loguru = "^0.7"
click = "^8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-cov = "^4.1"
black = "^23.12"
ruff = "^0.1"
mypy = "^1.7"
pre-commit = "^3.5"

[tool.poetry.group.test.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-cov = "^4.1"

[tool.poetry.scripts]
fritz-monitor = "fritz_monitoring.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/fritz_monitoring --cov-report=xml --cov-report=html"
