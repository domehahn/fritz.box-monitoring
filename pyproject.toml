[tool.poetry]
name = "fritz-monitoring"
version = "1.0.0"
description = "Fritz!Box monitoring with Prometheus and Grafana"
authors = ["Dominik Hahn"]
packages = [{include = "fritz_monitoring", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic-settings = ">=2.0.3"
prometheus-client = ">=0.17.1"
fritzconnection = ">=1.13.2"
loguru = ">=0.7.2"
flask = ">=3.0.0"
aiohttp = ">=3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^24.3.0"
ruff = "^0.0.280"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
