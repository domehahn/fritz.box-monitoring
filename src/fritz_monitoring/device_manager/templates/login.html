<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fritz!Box Device Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 6px;
        }

        p.sub {
            color: #888;
            font-size: 13px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0f0f0f;
            color: #e0e0e0;
            font-size: 14px;
        }

        button {
            margin-top: 24px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2196f3;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1976d2;
        }

        .error {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(244, 67, 54, 0.15);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🔧 Device Manager</h1>
        <p class="sub">Bitte mit den Admin-Zugangsdaten anmelden.</p>

        <form method="POST" action="{{ url_for('login', next=request.values.get('next', '')) }}">
            <label for="username">Benutzername</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus required>

            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit">Anmelden</button>
        </form>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>

</html>
