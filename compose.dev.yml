name: fritz-monitoring-dev

services:
  fritz-exporter:
    build:
      context: .
      dockerfile: docker/Dockerfile.exporter
    ports:
      - "8008:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9099:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/rules:/etc/prometheus/rules
      - ./config/blackbox/targets:/etc/blackbox/targets
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  iperf-probe:
    profiles:
      - iperf
    build:
      context: .
      dockerfile: docker/Dockerfile.iperf
    ports:
      - "9119:9119"
    environment:
      - IPERF_TARGET=${IPERF_TARGET:-}
      - IPERF_INTERVAL_SECONDS=${IPERF_INTERVAL_SECONDS:-600}
      - IPERF_DURATION_SECONDS=${IPERF_DURATION_SECONDS:-5}

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.25.0
    cap_add:
      - NET_RAW
    ports:
      - "9118:9115"
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'

  loki:
    image: grafana/loki:3.1.1
    ports:
      - "3108:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki

  tempo:
    image: grafana/tempo:2.6.0
    ports:
      - "3208:3200"
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]

  alloy:
    image: grafana/alloy:v1.3.1
    ports:
      - "1518:1514/udp"
      - "12348:12345"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: >-
      run
      --server.http.listen-addr=0.0.0.0:12345
      --storage.path=/tmp/alloy
      /etc/alloy/config.alloy

  grafana:
    image: grafana/grafana:11.5.0
    ports:
      - "${GRAFANA_BIND_ADDRESS:-0.0.0.0}:${GRAFANA_PORT:-3030}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  alertbridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.home_iot
    command: ["python", "-m", "home_iot.alertbridge"]
    env_file:
      - .env
      - .env.production
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  alertmanager_data:

